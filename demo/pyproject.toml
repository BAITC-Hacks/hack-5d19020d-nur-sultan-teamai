[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wind-demo"
version = "0.1.0"
description = "MVP wind power forecasting agent (fixtures + Open-Meteo + CatBoost + LangGraph)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pyarrow>=14",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "scikit-learn>=1.4",
  "catboost>=1.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "streamlit>=1.32",
  "plotly>=5.18",
  "typer>=0.12",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wind-demo = "wind_demo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wind_demo"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
