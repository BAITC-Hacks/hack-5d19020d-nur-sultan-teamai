[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wind-agent"
version = "0.1.0"
description = "Auditable, weather-only wind power forecasts and historical replay"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<3", "openpyxl>=3.1,<4", "pyarrow>=19,<24",
  "pydantic>=2.11,<3", "python-dotenv>=1,<2", "tzdata>=2025",
  "scikit-learn>=1.6,<2", "catboost>=1.2.8,<2", "httpx>=0.28,<1",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.45,<2", "plotly>=6,<7",
  "typer>=0.16,<1", "langgraph>=1,<2", "openai>=2,<3", "eccodes>=2.40,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
wind-agent = "wind_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["wind_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
